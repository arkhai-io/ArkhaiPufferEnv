# Install torch etc. or use our docker image and clone this repo
# pip install -e . --no-build-isolation
# To rebuild the C env:
# python setup.py build_arkhai --inplace --force
# Training:
# python -m pufferlib.pufferl train puffer_arkhai
# Sweeps:
# python -m pufferlib.pufferl sweep puffer_arkhai --<neptune/wandb> --tag <sweep name>
# We now suggest WandB. OpenAI bought neptune and is shutting it down soon.
# Note: this is all the same as the docs. No difference for your env w/ current 3.0
# C test:
# bash scripts/build_ocean.sh arkhai <local/fast>
# ./arkhai

[base]
package = ocean
env_name = puffer_arkhai
policy_name = Policy
rnn_name = Recurrent

[env]
# This is the number of environment simulated per worker/core
num_envs = 1024

# Number of GPU types (slots). Increase this and add gpu_N_* keys to add more types.
node_types = 3

# Anything set here will be passed to the ocean/arkhai/arkhai.py via **kwargs and then through ocean/arkhai/binding.c into the env.
ai_sellers = 1
ai_buyers = 0
scripted_sellers = 0
scripted_buyers = 1
episode_length = 100
request_timeout = 5
job_gpu_0_nodes = 10
job_gpu_0_nodes_dr = 0.2
job_gpu_1_nodes = 10
job_gpu_1_nodes_dr = 0.2
job_gpu_2_nodes = 10
job_gpu_2_nodes_dr = 0.2
job_duration = 10
job_duration_dr = 0.2
job_tb_usage = 0.2
job_tb_usage_dr = 0.2
job_efficiency = 0.8
job_efficiency_dr = 0.2
scripted_buy_price = 0.9
scripted_buy_price_dr = 0.2
scripted_sell_price = 0.9
scripted_sell_price_dr = 0.2
reward_scale = 0.0001
tb_price = 0.03
gpu_0_price = 5.31
gpu_0_kw = 6.5
gpu_1_price = 15.92
gpu_1_kw = 10.0
gpu_2_price = 0.37
gpu_2_kw = 1.0
energy_demand_base = 1500.0
kwh_price_base = 0.02
kwh_price_sensitivity = 0.0000001
kwh_demand_threshold = 1400
a1 = -374
b1 = -387
a2 = -4.6
b2 = -17.1
a3 = 3.2
b3 = 18.9

# Randomizes the tick on the first reset.
randomize_offset = 1

# Unused. Might be good to have a way to enable preset test configs.
preset = 0

cluster_gpu_0_capacity = 100
cluster_gpu_0_capacity_dr = 0.2
cluster_gpu_1_capacity = 100
cluster_gpu_1_capacity_dr = 0.2
cluster_gpu_2_capacity = 100
cluster_gpu_2_capacity_dr = 0.2
cluster_tb_capacity = 100
cluster_tb_capacity_dr = 0.2
cluster_kwh_capacity = 100
cluster_kwh_capacity_dr = 0.2
cluster_kw_generation = 10
cluster_kw_generation_dr = 0.2


