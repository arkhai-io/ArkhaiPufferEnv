# pyproject.toml for Arkhai PufferAI Integration
# Dependencies match setup.py exactly

[project]
name = "pufferlib"
version = "3.0.0"
description = "Fast and sane reinforcement learning"
requires-python = ">=3.9"
readme = {file = "README.md", content-type = "text/markdown"}
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Joseph Suarez", email = "jsuarez@puffer.ai" }]
classifiers=[
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

# Dependencies from setup.py install_requires
# These match exactly what setup.py installs by default
dependencies = [
    "setuptools",
    "numpy<2.0",
    "shimmy[gym-v21]",
    "gym==0.23",
    "gymnasium==0.29.1",
    "pettingzoo==1.24.1",
    # Training dependencies (from setup.py when NO_TRAIN is not set)
    "torch",
    "psutil",
    "nvidia-ml-py",
    "rich",
    "rich_argparse",
    "imageio",
    "gpytorch",
    "scikit-learn",
    "heavyball>=2.2.0",
    "neptune",
    "wandb",
    # Additional dependency for puffer CLI
    "pyro-ppl",
]

[project.scripts]
puffer = "pufferlib.pufferl:main"

[project.urls]
Homepage = "https://puffer.ai"

[build-system]
requires = ["setuptools", "wheel", "Cython", "numpy<2.0", "torch"]
build-backend = "setuptools.build_meta"

[tool.uv]
no-build-isolation-package = ["torch"]
cache-keys = [
    { file = "setup.py" },
    { file = "setup.cfg" },
    { file = "pufferlib/ocean/**/*.c" },
    { file = "pufferlib/ocean/**/*.h" },
    { file = "pufferlib/extensions/*.cpp" },
    { file = "pufferlib/extensions/*.cu" },
]
